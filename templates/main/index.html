{% extends "base.html" %}

{% block content %}


<!--새 방 만들기-->
<div class="p-4 border-2 border-blue-500 rounded">
    <h2 class="text-xl font-bold text-blue-500">새 방 만들기</h2>
    <p>방 생성 시, 방장이 됩니다</p>
    <form action="{{ url_for('teams.making_team') }}" method="post">
        <div class="flex gap-3">
            <input type="text" placeholder="팀명" name="teamid" class="border p-2">
            <input type="text" placeholder="주제" name="title" class="border p-2">
            <input type="number" placeholder="인원" name="peoplenum" class="border p-2">
        </div>
        <button type="submit" class="p-4 border-2 border-blue-500">방 만들기</button>
    </form>
</div>

<!--코드로 참가하기-->
<div class="p-4 border-2 border-blue-500 rounded">
    <h2>코드로 참가하기</h2>

    <form action="{{ url_for('teams.join_team') }}"  method="post">
        초대코드
        <input type="text" name="code" placeholder="초대코드" class="border p-2">
        <button type="submit">참가하기</button>
    </form>
</div>

<!--진행중인 방-->
<div class="p-4 border-2 border-blue-500 rounded">
    <h2>진행중인 방</h2>
    <div class="flex gap-3">
        <div class="p-4 border-2 border-black-500 rounded">
            <div>팀명</div>
            <div>목표</div>
            <div>주제</div>
            <div>몇명인지</div>
            <div>상태(Status)</div>
        </div>
    </div>
</div>


<!--종료된 방-->
<div class="p-4 border-2 border-gray-500 rounded">
    <h2>종료된 방</h2>
    <div class="flex gap-3">
        <div class="p-4 border-2 border-black-500 rounded">
            <div>팀명</div>
            <div>목표/주제</div>
            <div>몇명인지</div>
            <div>상태(Status)</div>
        </div>
    </div>
</div>

{% endblock %}
