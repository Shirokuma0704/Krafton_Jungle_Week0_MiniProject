{% extends "base.html" %}

{% block content %}

{% if error %}
<script>
    alert("{{ error }}");
</script>
{% endif %}

<form method="post" class="auth-form">
    <label>아이디</label>
    <input type="text" name="userid">

    <label>비밀번호</label>
    <input type="password" name="password">

    <button type="submit">로그인</button>
    <a href="{{ url_for('auth.signup') }}">회원가입</a>
</form>

{% endblock %}
